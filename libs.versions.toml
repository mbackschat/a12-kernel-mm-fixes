[versions]
extVersion = "56"
currentKernelVersion = "31.0.1" # If changed you have to also
# - adapt the kernel-core-runtime artifactId!
# - minKernelCoreRuntimeApiVersion _should_ also be updated to match the version that is transitively referenced by the core-runtime of currentKernelVersion
# - run "gradle generateThirdPartyNotice" and commit THIRD_PARTY_NOTICES and licenses/* if changed

# NOTE: minKernelCoreRuntimeApiVersion is _not_ unused, even if intellij thinks so,
# our conventions pulgins read this manually
minKernelCoreRuntimeApiVersion = "33.0.2" # actual version will/may be higher if the runtime depends on a higher version. we just need to specify _some_ (effectively minimum) version because cyclonedx will otherwise fail
kernelRuntimeArtifactId = "31-0"
# com-mgmtp-a12-base is read from mm-typings-conventions; do not delete the following line (even though intellij thinks it is unused)
com-mgmtp-a12-base = "29.0.1"
org-junit-jupiter = "5.11.4"
org-junit-platform = "1.11.4"


[libraries]
kernelBom = { module = "com.mgmtp.a12.kernel:kernel-bom", version.ref = "currentKernelVersion" }

kernel-md-serializer = { module = "com.mgmtp.a12.kernel:kernel-md-serializer", version.ref = "currentKernelVersion" }
kernel-md-facade = { module = "com.mgmtp.a12.kernel:kernel-md-facade", version.ref = "currentKernelVersion" }

commonsCompress = "org.apache.commons:commons-compress:1.28.0"

junitJupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "org-junit-jupiter" }
junitJupiterApi = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "org-junit-jupiter" }
junitJupiterParams = { module = "org.junit.jupiter:junit-jupiter-params", version.ref = "org-junit-jupiter" }
junitPlatformLauncher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "org-junit-platform" }

[bundles]

[plugins]
