[versions]
extVersion = "55"
currentKernelVersion = "30.8.1" # If changed you have also to adapt the kernel-core-runtime artifactId!!!. Additionally, minKernelCoreRuntimeApiVersion _should_ be updated to match the version that is transitively referenced by the core-runtime of currentKernelVersion
minKernelCoreRuntimeApiVersion = "32.3.4" # actual version will/may be higher if the runtime depends on a higher version. we just need to specify _some_ (effectively minimum) version because cyclonedx will otherwise fail
kernelRuntimeArtifactId = "30-8"
com-mgmtp-a12-base = "29.0.1"
org-junit-jupiter = "5.11.4"
org-junit-platform = "1.11.4"


[libraries]
kernelBom = { module = "com.mgmtp.a12.kernel:kernel-bom", version.ref = "currentKernelVersion" }
kernel-md-typed-accessor-gen = { module = "com.mgmtp.a12.kernel:kernel-md-typed-accessor-gen", version.ref = "currentKernelVersion" }
kernel-md-document-v2 = { module = "com.mgmtp.a12.kernel:kernel-md-document-v2", version.ref = "currentKernelVersion" }
kernel-md-util = { module = "com.mgmtp.a12.kernel:kernel-md-util", version.ref = "currentKernelVersion" }

kernel-md-serializer = { module = "com.mgmtp.a12.kernel:kernel-md-serializer", version.ref = "currentKernelVersion" }
kernel-md-model = { module = "com.mgmtp.a12.kernel:kernel-md-model", version.ref = "currentKernelVersion" }
kernel-core-base-utils = { module = "com.mgmtp.a12.kernel:kernel-core-base-utils", version.ref = "currentKernelVersion" }

commonsCompress = "org.apache.commons:commons-compress:1.28.0"

junitJupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "org-junit-jupiter" }
junitJupiterApi = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "org-junit-jupiter" }
junitJupiterParams = { module = "org.junit.jupiter:junit-jupiter-params", version.ref = "org-junit-jupiter" }
junitPlatformLauncher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "org-junit-platform" }

[bundles]

[plugins]
